<!DOCTYPE html>
<html lang="pt-BR">
<!-- Inicio do Head-->
<head>  
<meta charset="UTF-8">
     <title>Trabalhe Conosco</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <meta name="description" content="Formulário de Cadastro de clientes">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" 
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

    <style>
        .adicionar_borda {
           border-width: 1px;
           border-style: solid;
           border-color: black;            
        }
    </style>
</head>
<!-- Final do Head-->

<!-- Inicio do Body -->
<body class="bg-secondary">
<!-- 
    DIV - Prinicipal
    Area principal do site contem o 
        - Header
        - Main 
        - Footer
 -->
<div id="div_principal" class="container adicionar_borda bg-light">
    <!--
        Header da pagina 
        [-] Logotipo 
        [-] Titulo
        [-] Menu Principal
        [-] Login / Logout / Criar conta
    -->
    <header class="adicionar_borda">
        <div class="row">
            <div class="col-12">
                Logo / Titulo
            </div>
        </div>

        <div class="row">
            <div class="col-9">
                Menu principal
            </div>
            <div class="col-3">
                Login/Logout |
                Cadastrar 
            </div>
        </div>
        
    </header>

    <!-- 
        Main da pagina 
    -->
    <main class="adicionar_borda">
        <!-- Formulário de Cadastro -->
        <form action="cadastro/" method="get" target="_blank">

            <!-- Nome Completo -->
            <div class="m-3">
                <label class="form-label" 
                    for="nome">Nome Completo:</label>
                <input class="form-control"
                    type="text" id="nome" name="nome" 
                    required placeholder="Seu nome completo"
                    title="Informe o seu nome completo (campo obrigatório)">
            </div>


            <div class="m-3">
            <!-- E-mail de login -->
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control"
                    type="email" id="email" name="email" 
                    required placeholder="exemplo@email.com">

            <div class="m-3">
            <!-- Estado -->
                <label for="estado" class="form-label for=Estado">Estado (UF):</label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="" disabled selected>Selecione...</option>
                    <option value="AC">AC - Acre</option>
                    <option value="AL">AL - Alagoas</option>
                    <option value="AP">AP - Amapá</option>
                    <option value="AM">AM - Amazonas</option>
                    <option value="BA">BA - Bahia</option>
                    <option value="CE">CE - Ceará</option>
                    <option value="DF">DF - Distrito Federal</option>
                    <option value="ES">ES - Espírito Santo</option>
                    <option value="GO">GO - Goiás</option>
                    <option value="MA">MA - Maranhão</option>
                    <option value="MT">MT - Mato Grosso</option>
                    <option value="MS">MS - Mato Grosso do Sul</option>
                    <option value="MG">MG - Minas Gerais</option>
                    <option value="PA">PA - Pará</option>
                    <option value="PB">PB - Paraíba</option>
                    <option value="PR">PR - Paraná</option>
                    <option value="PE">PE - Pernambuco</option>
                    <option value="PI">PI - Piauí</option>
                    <option value="RJ">RJ - Rio de Janeiro</option>
                    <option value="RN">RN - Rio Grande do Norte</option>
                    <option value="RS">RS - Rio Grande do Sul</option>
                    <option value="RO">RO - Rondônia</option>
                    <option value="RR">RR - Roraima</option>
                    <option value="SC">SC - Santa Catarina</option>
                    <option value="SP">SP - São Paulo</option>
                    <option value="SE">SE - Sergipe</option>
                    <option value="TO">TO - Tocantins</option>
                </select>
            <!-- Botões -->
            <div class="m-3 row">
                <div class="col-6">
                    <button type="submit"   
                        class="form-control btn btn-outline-primary">
                        Enviar
                    </button>
                </div>
                <div class="col-6">
                    <button type="reset" 
                        class="form-control btn btn-outline-warning">
                        Limpar
                    </button>
                </div>
            </div>

        </form>
        <!-- Final do Form -->
    </main>

    <!--
        Footer da pagina 
        [-] Menu Secundário
        [-] Contato
        [-] Copyright do site
        [-] Redes Sociais
    -->
    <footer class="adicionar_borda">
        <div class="row">
            <div class="col-4">
                Menu Secundário
            </div>

            <div class="col-5">
                Contato <br>
                Copyright
            </div>

            <!--
                Redes Sociais - Github, Youtube, Instagran, 
                                Linkedin, Facebook                
            -->
        <div class="col-3 d-flex gap-3">
            <a href="https://github.com/victorhugorochadasilva021-droid" target="_blank" rel="noopener noreferrer" class="fs-4" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>

            <a href="https://instagram.com/vhrdwhh" target="_blank" rel="noopener noreferrer" class="fs-4" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.youtube.com/@verriseven" target="_blank" rel="noopener noreferrer" class="fs-4" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
</div>
            
            </div>
    </footer>
</div> 
<!-- Final da Div Principal-->   

<!-- Não apague a tag "SCRIPT" -->
<!-- Bootstrap JS e dependências -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
<!-- Não apague a tag "SCRIPT" -->
</body>
<!-- Final do Body-->
</html>
